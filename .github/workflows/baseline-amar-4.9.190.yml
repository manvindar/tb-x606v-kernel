        run: |
          set -uo pipefail
          rc=0
          python3 scripts/baseline/dtbo_receipt.py src src/out data/amar/dtbo-diagnostic.json "$(cat out-receipts/dtbs.exit 2>/dev/null || echo 99)" out-receipts/dtbo-receipt.json || rc=$?
          echo "$rc" > out-receipts/dtbo-receipt.exit
          mkdir -p dist
          D=src/out/arch/arm64/boot/dts/mediatek
          for f in mt6765.dtb achilles6_row_call.dtb achilles6_row_call.dtb.merge; do
            test -f $D/$f && cp $D/$f dist/ && src/out/scripts/dtc/dtc -I dtb -O dts -o dist/$f.dts $D/$f 2>/dev/null
          done
          (cd $D && find . -name 'cust*.dtsi' -print0 | xargs -0 -I{} cp --parents {} ../../../../../../../dist/ 2>/dev/null) || true
          cp -f out-receipts/* dist/ 2>/dev/null || true
          tail -n 400 dtbs.log > dist/dtbs-tail.log 2>/dev/null || true
          grep -n "DCT_INFO\|DrvGen" dtbs.log | head -40 > dist/drvgen-info.txt 2>/dev/null || true
