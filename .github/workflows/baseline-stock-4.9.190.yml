name: Baseline stock 4.9.190 diagnostic
# Diagnostic only: builds Image.gz from a pinned third-party 4.9.190 tree with the pinned stock device config
# (no android16 fragment, no PowerVR port, no release, no device action) and gates it against the shipping kernel
# export CRCs and the complete installed vendor module set. A PASS is necessary, not sufficient, for any flash.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SRC_REPO: https://github.com/philmb3487/android_kernel_lenovo_achilles6.git
jobs:
  baseline:
    runs-on: ubuntu-22.04   # python2 (MediaTek DrvGen.py) is only packaged up to 22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        sha:
          - 0a95b5010777186eed379b2ed11e3d1a4f85921e
          - 51ba160931e89c2539f5d07b4fd978dac5f63092
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests for the gate and inventory tools
        run: python3 scripts/baseline/test_gate_candidate.py
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bc bison flex libssl-dev device-tree-compiler python3 python2 xz-utils
      - name: Fetch and verify pinned toolchains
        run: |
          set -euo pipefail
          mkdir -p tc/clang tc/gcc64 tc/gcc32 dl out-receipts
          A=https://android.googlesource.com
          get() {  # name repo commit subpath dest
            u="$A/$2/+archive/$3${4:+/$4}.tar.gz"
            curl -sfL --retry 6 --retry-all-errors --retry-delay 5 -o "dl/$1.tar.gz" "$u"
            tar xzf "dl/$1.tar.gz" -C "tc/$5"
            python3 - "$1" "dl/$1.tar.gz" <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts/baseline')
          from tree_hash import tree_hash
          name, path = sys.argv[1:3]
          pin = json.load(open('data/baseline/toolchain-pins.json'))[name]
          digest, files = tree_hash(path)
          print(name, digest, files)
          assert digest == pin['tree_sha256'] and files == pin['files'], f'{name} content hash differs from pin'
          PY
          }
          P=data/baseline/toolchain-pins.json
          pin() { python3 -c "import json;print(json.load(open('$P'))['$1']['$2'])"; }
          get clang "$(pin clang repo)" "$(pin clang commit)" clang-r353983c clang
          get gcc64 "$(pin gcc64 repo)" "$(pin gcc64 commit)" "" gcc64
          get gcc32 "$(pin gcc32 repo)" "$(pin gcc32 commit)" "" gcc32
          rm -rf dl
      - name: Fetch and verify the pinned source
        run: |
          set -euo pipefail
          mkdir src && cd src && git init -q . && git fetch -q --depth 1 "$SRC_REPO" "${{ matrix.sha }}" && git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile | tr -d ' ' | tr '\n' ' ' | grep -qx 'VERSION=4 PATCHLEVEL=9 SUBLEVEL=190 '
          cd ..
          python3 - <<'PY'
          import hashlib, json
          src = json.load(open('data/baseline/sources.json'))
          assert "${{ matrix.sha }}" in [r['sha'] for r in src['refs']], 'sha not in pinned list'
          h = hashlib.sha256(open(src['config']['path'], 'rb').read()).hexdigest()
          assert h == src['config']['sha256'], 'stock config differs from pin'
          json.dump(dict(repo=src['repo'], sha="${{ matrix.sha }}", config_sha256=h), open('out-receipts/source-receipt.json', 'w'), indent=1)
          PY
      - name: Configure with the stock config
        run: |
          set -euo pipefail
          cd src
          export PATH=$GITHUB_WORKSPACE/tc/clang/bin:$GITHUB_WORKSPACE/tc/gcc64/bin:$GITHUB_WORKSPACE/tc/gcc32/bin:$PATH
          printf '#!/bin/sh\nexec gcc -fcommon "$@"\n' > $GITHUB_WORKSPACE/hostgcc && chmod +x $GITHUB_WORKSPACE/hostgcc  # old dtc needs -fcommon on gcc>=10
          mkdir -p out && cp ../config/stock-4.9.190-achilles6_row_call.config out/.config
          M="ARCH=arm64 O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- python=python2 HOSTCC=$GITHUB_WORKSPACE/hostgcc"
          printf 'M=%q\n' "$M" > ../make-vars.env
          make $M olddefconfig > ../olddefconfig.log 2>&1 || { tail -40 ../olddefconfig.log; exit 1; }
          python3 ../scripts/baseline/config_drift.py ../config/stock-4.9.190-achilles6_row_call.config out/.config ../out-receipts/config-drift.json
          { clang --version | head -2; aarch64-linux-android-gcc --version | head -1; python2 --version 2>&1; dpkg-query -W bc bison flex libssl-dev device-tree-compiler python2; } > ../out-receipts/tool-versions.txt 2>&1
      - name: Build Image.gz (no modules, no DTBs, no PVR port)
        run: |
          set -uo pipefail
          cd src
          export PATH=$GITHUB_WORKSPACE/tc/clang/bin:$GITHUB_WORKSPACE/tc/gcc64/bin:$GITHUB_WORKSPACE/tc/gcc32/bin:$PATH
          . ../make-vars.env
          export KBUILD_BUILD_USER=baseline KBUILD_BUILD_HOST=github
          make $M -j"$(nproc)" Image.gz > ../build.log 2>&1; rc=$?
          echo "{\"image_gz_exit\": $rc}" > ../out-receipts/build-exit.json
          grep -E "error:|\*\*\*|undefined reference" ../build.log | head -60 || true
          exit $rc
      - name: Best-effort DTB build (diagnostic only)
        continue-on-error: true
        run: |
          cd src
          export PATH=$GITHUB_WORKSPACE/tc/clang/bin:$GITHUB_WORKSPACE/tc/gcc64/bin:$GITHUB_WORKSPACE/tc/gcc32/bin:$PATH
          . ../make-vars.env
          make $M -j"$(nproc)" dtbs > ../dtbs.log 2>&1; rc=$?
          echo "{\"dtbs_exit\": $rc}" > ../out-receipts/dtbs-exit.json
          tail -20 ../dtbs.log; exit $rc
      - name: Gate against shipping kernel and installed module set
        run: |
          set -o pipefail
          python3 scripts/baseline/gate_candidate.py --symvers src/out/Module.symvers --image src/out/arch/arm64/boot/Image.gz \
            --inventory data/baseline/shipping-module-inventory.json --shipping-exports data/baseline/shipping-export-crcs.json \
            --report out-receipts/gate.json | tee gate.txt
      - name: Collect bounded outputs
        if: always()
        run: |
          mkdir -p dist
          cp -f out-receipts/* dist/ 2>/dev/null || true
          cp -f src/out/arch/arm64/boot/Image.gz src/out/.config src/out/Module.symvers dist/ 2>/dev/null || true
          tail -n 3000 build.log > dist/build-tail.log 2>/dev/null || true
          tail -n 200 dtbs.log > dist/dtbs-tail.log 2>/dev/null || true
          cp -f olddefconfig.log dist/ 2>/dev/null || true
          (cd dist && sha256sum * > SHA256SUMS)
          du -sh dist; { echo "### ${{ matrix.sha }}"; sed -n '1,40p' gate.txt 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: baseline-${{ matrix.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: warn
