name: Build kernel
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release with the boot image
        type: boolean
        default: false
      port_pvr13:
        description: Compile experimental PowerVR 1.13 port; never publish or flash
        type: boolean
        default: false
      inspect_firmware:
        description: Inspect the published donor vendor image without building or writing a tablet
        type: boolean
        default: false
      tag:
        description: Release tag
        default: kernel-a17-ci
permissions:
  contents: write
env:
  SRC_REPO: UsrBinLuna/kernel_lenovo_achilles6   # Lenovo OSS drop, 4.9.117 (the 4.9.302 community tree does not compile)
  AOSP: https://android.googlesource.com/platform/prebuilts
  REF: refs/heads/android10-release
jobs:
  build:
    if: ${{ !inputs.inspect_firmware }}
    runs-on: ubuntu-22.04   # python2 (MediaTek DrvGen.py) is only packaged up to 22.04
    steps:
      - name: Reject publication of an unvalidated driver port
        if: inputs.port_pvr13 && inputs.publish
        run: exit 1
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bc bison flex libssl-dev device-tree-compiler python3 python2 xz-utils ccache
      - name: Cache toolchains and ccache
        uses: actions/cache@v6
        with:
          path: |
            tc
            ~/.cache/ccache
          key: kernel-tc-r353983c-${{ github.run_id }}
          restore-keys: kernel-tc-r353983c-
      - name: Fetch toolchains (clang r353983c, gcc 4.9 as used by the stock build)
        run: |
          mkdir -p tc/clang tc/gcc64 tc/gcc32
          get() { [ -n "$(ls -A "tc/$1" 2>/dev/null)" ] || curl -sfL --retry 6 --retry-all-errors --retry-delay 5 "$2" | tar xz -C "tc/$1"; }
          get clang "$AOSP/clang/host/linux-x86/+archive/$REF/clang-r353983c.tar.gz"
          get gcc64 "$AOSP/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/$REF.tar.gz"
          get gcc32 "$AOSP/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/$REF.tar.gz"
      - name: Clone and patch the kernel
        run: |
          git clone --depth 1 https://github.com/$SRC_REPO.git src
          cd src
          git checkout 7f6a59c5b8d6ee27b29c91d07f77ec97393f3544
          for p in ../patches/*.patch; do git apply --check "$p" && git apply --verbose "$p" || echo "SKIPPED $p"; done
      - name: Stage pinned PowerVR 1.13 port
        if: inputs.port_pvr13
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/rabbit-hmi-oss/android_kernel_rabbit_mt6765.git donor
          git -C donor sparse-checkout set drivers/gpu/mediatek/gpu_rgx/m1.13ED5776728
          test "$(git -C donor rev-parse HEAD)" = 8167c8c1087f057d2ef302fc93b47554291687ec
          python3 scripts/stage_pvr13.py src donor pvr13-stage-receipt.json
      - name: Build
        run: |
          cd src
          export PATH=$GITHUB_WORKSPACE/tc/clang/bin:$GITHUB_WORKSPACE/tc/gcc64/bin:$GITHUB_WORKSPACE/tc/gcc32/bin:$PATH
          printf '#!/bin/sh\nexec gcc -fcommon "$@"\n' > $GITHUB_WORKSPACE/hostgcc && chmod +x $GITHUB_WORKSPACE/hostgcc  # old dtc needs -fcommon on gcc>=10
          printf '#!/bin/sh\nexec ccache clang "$@"\n' > $GITHUB_WORKSPACE/ccache-clang && chmod +x $GITHUB_WORKSPACE/ccache-clang
          export CCACHE_BASEDIR=$GITHUB_WORKSPACE CCACHE_NOHASHDIR=1 CCACHE_COMPRESS=1 CCACHE_MAXSIZE=1G
          M="ARCH=arm64 O=out CC=$GITHUB_WORKSPACE/ccache-clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- python=python2 HOSTCC=$GITHUB_WORKSPACE/hostgcc"
          make $M achilles6_row_call_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config ../config/android16.fragment
          if [ "${{ inputs.port_pvr13 }}" = true ]; then
            ./scripts/config --file out/.config --set-str MTK_GPU_VERSION 'rgx pvr13 m1.13ED5776728'
          fi
          make $M olddefconfig
          make $M -k -j"$(nproc)" Image.gz-dtb > ../build.log 2>&1 || { grep -E "error:|\*\*\*|undefined reference" ../build.log | head -60; exit 1; }
          ccache -s | head -6
          ls -l out/arch/arm64/boot/Image.gz-dtb
      - name: Retain compile diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pvr13-compile-diagnostics
          path: |
            build.log
            pvr13-stage-receipt.json
            src/out/.config
            src/out/Module.symvers
          if-no-files-found: warn
      - name: Verify new driver is linked
        if: inputs.port_pvr13
        run: |
          strings src/out/vmlinux | grep -F '1.13@5776728'
          nm src/out/vmlinux | grep -F 'RGXDevInitCompatCheck'
      - name: Repack boot.img
        run: |
          # stock boot.img is not redistributed: the repack needs it, so publish the kernel and a patch script instead
          mkdir dist
          cp src/out/arch/arm64/boot/Image.gz-dtb dist/
          cp src/out/.config dist/config
          cp src/out/Module.symvers dist/Module.symvers
          cp scripts/repack_boot.py dist/
          cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with: { name: kernel, path: dist/ }
      - name: Publish release
        if: ${{ inputs.publish }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "${{ inputs.tag }}" dist/* --title "Kernel 4.9 for TB-X606V (${{ inputs.tag }})" \
            --notes "Image.gz-dtb with the F_SEAL_FUTURE_WRITE backport. Pack it into your boot.img with repack_boot.py, then test with fastboot boot (RAM only)."

  donor-firmware:
    if: inputs.inspect_firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Inspect exact published donor archive
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o donor.zip https://github.com/rabbit-hmi-oss/firmware/releases/download/v0.8.293/rabbit_OS_v0.8.293.zip
          sha256sum donor.zip > donor-archive.sha256
          unzip -p donor.zip rabbit_OS_v0.8.293_20250516110545/super.img > super.img
          rm donor.zip
          mkdir -p donor-gpu
          python3 scripts/inspect_donor_gpu.py super.img donor-gpu
          python3 scripts/inspect_rgx_firmware.py donor-gpu/firmware/rgx.fw > donor-gpu/firmware-footer.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: powervr-donor-gpu-stack
          path: |
            donor-gpu/
            donor-archive.sha256
          if-no-files-found: warn
